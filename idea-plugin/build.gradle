plugins {
    id 'java'
    // 2.18.x requires Gradle 9; current repository wrapper is 8.14.3.
    id 'org.jetbrains.intellij.platform' version '2.6.0'
}

group = 'com.biz.sccba'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity('2025.1.3')
    }

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.code.gson:gson:2.13.1'
}

intellijPlatform {
    pluginConfiguration {
        ideaVersion {
            sinceBuild = '251'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 当前 Tool Window 没有可搜索设置页，跳过启动 IDE 生成 searchable options，避免无显示器环境打包失败。
tasks.named('buildSearchableOptions') {
    enabled = false
}

tasks.named('test') {
    // IntelliJ 平台的测试任务会启动 IDE 测试环境；当前契约测试不依赖 IDE，使用下方 contractTest。
    enabled = false
}

tasks.register('contractTest', Test) {
    description = 'Runs isolated HTTP/plugin contract tests without starting an IntelliJ test IDE.'
    group = 'verification'
    useJUnit()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

tasks.named('check') {
    dependsOn(tasks.named('contractTest'))
}

// Structural gate referenced by scripts/acceptance.sh and .github/workflows/verify.yml:
// plugin.xml must exist and declare the plugin id, tool window factory and services
// (asserted by PluginDescriptorTest inside contractTest), and the IntelliJ Platform
// project configuration must verify. The platform plugin (2.6.0) already registers a
// verifyPluginStructure task; extend it with the descriptor contract tests.
tasks.named('verifyPluginStructure') {
    dependsOn(tasks.named('contractTest'))
}

tasks.register('uiSmoke') {
    group = 'verification'
    description = 'Runs the macOS IntelliJ runIde Tool Window smoke test in a logged-in GUI session.'
    doLast {
        exec {
            workingDir(projectDir)
            commandLine('bash', 'scripts/run-ide-ui-smoke.sh')
        }
    }
}
