services:
  postgres:
    image: postgres:16-alpine
    container_name: sql-analyzer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sql_analyzer}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    build: .
    container_name: sql-analyzer-agent
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_ANALYZER_PERSISTENCE_ENABLED: "true"
      SQL_ANALYZER_WORKER_ENABLED: "true"
      SQL_ANALYZER_POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sql_analyzer}
      SQL_ANALYZER_POSTGRES_USERNAME: ${POSTGRES_USER:-postgres}
      SQL_ANALYZER_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "${AGENT_PORT:-18881}:18881"

volumes:
  postgres_data:
