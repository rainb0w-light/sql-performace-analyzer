server:
  port: 18881

spring:
  application:
    name: sql-performance-analyzer
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  llms:
    configs:
      - name: deepseek
        api-key: ""
        base-url: https://api.deepseek.com
        model: deepseek-chat
        temperature: 0.2

sql-analyzer:
  persistence:
    enabled: true
    # Docker-free default: restart-recoverable file H2. The effective database file is
    # ${SQL_ANALYZER_H2_DATA_PATH}.mv.db; by default:
    # ~/.sql-performance-analyzer/data/management.mv.db
    #
    # Flyway remains the only schema initializer. JDBC metadata selects:
    #   H2         -> classpath:db/migration-h2 + classpath:db/migration-common
    #   PostgreSQL -> classpath:db/migration    + classpath:db/migration-common
    #
    # Production can override SQL_ANALYZER_JDBC_URL/USERNAME/PASSWORD with PostgreSQL.
    # The legacy SQL_ANALYZER_POSTGRES_* names remain accepted for compatibility.
    jdbc-url: jdbc:h2:file:/Volumes/Appdata/codebase/sql-performance-analyzer/data/management;AUTO_SERVER=TRUE
    username: sa
    password: ""
    maximum-pool-size: 10
  worker:
    enabled: true
    poll-delay-ms: 500
  limits:
    max-concurrent-runs: 10
  analysis:
    # Both operations are opt-in: EXPLAIN opens a read-only target connection; Agent enhancement
    # invokes the configured model. The deterministic report remains available when either is off.
    explain-enabled: false
    agent-enhancement-enabled: false
    agent-enhancement-model: ""
    agent-enhancement-max-output-chars: 20000
  knowledge:
    upload:
      max-file-bytes: 10485760
      max-chunks: 1000
      parse-timeout-ms: 30000
      max-expanded-bytes: 52428800
    operations:
      retention-days: 90
      export-limit: 5000
    vector:
      # Requires a PostgreSQL with the pgvector extension; structured search works regardless.
      enabled: false
      jdbc-url: jdbc:postgresql://localhost:5432/sql_analyzer
      username: postgres
      password: postgres
      schema: sql_analyzer
      table: kb_embedding
      dimensions: 1024
    embedding:
      api-key: ""
      base-url: https://api.openai.com
      model: text-embedding-3-small
  profiling:
    sample-rows: 50000
    top-k: 10
    statement-timeout-ms: 10000
  local-h2:
    datasource-bootstrap:
      # A client with no configured target receives one local, read-only static-analysis
      # context. Existing profiles are never changed, and PostgreSQL management mode ignores it.
      enabled: true
      jdbc-url: jdbc:h2:file:/Users/qili/.sql-performance-analyzer/data/local-target;AUTO_SERVER=TRUE
      username: sa

logging:
  level:
    root: INFO
    com.biz.sccba.sqlanalyzer: INFO
