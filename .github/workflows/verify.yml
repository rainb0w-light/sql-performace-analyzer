name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Backend tests and PostgreSQL integration gate
        env:
          RUN_POSTGRES_INTEGRATION_TESTS: 'true'
        run: ./gradlew clean test bootJar --no-daemon --console=plain
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: sql-performance-analyzer-backend
          path: build/libs/sql-performance-analyzer-*.jar
          if-no-files-found: error

  idea-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: IDEA plugin contract tests and packaging
        working-directory: idea-plugin
        run: ../gradlew clean check buildPlugin verifyPluginStructure --no-daemon --console=plain
      - name: Upload IDEA plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: sql-performance-analyzer-idea-plugin
          path: idea-plugin/build/distributions/*.zip
          if-no-files-found: error
