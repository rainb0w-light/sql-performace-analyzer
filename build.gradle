plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'SQL Performance Analyzer'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven {
        url = uri("https://repo.spring.io/milestone")
    }
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 数据库中立的领域持久层（docs/cloud-code-next-goal.md §3.2：Spring Data JDBC，不引入 JPA/Hibernate 自动建表）
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'

    implementation 'org.postgresql:postgresql:42.7.7'
    // 目标数据库只读证据采集（GoldenDB 使用部署环境提供的兼容驱动）
    implementation 'com.mysql:mysql-connector-j:9.4.0'
    implementation 'org.flywaydb:flyway-core:10.22.0'
    // Flyway 10 将 PostgreSQL 方言拆出 core；缺少它时对 PostgreSQL 报 "Unsupported Database"。
    implementation 'org.flywaydb:flyway-database-postgresql:10.22.0'
    // 管理数据库可选 H2（无 Docker 本地门禁与开发模式）；H2 方言内置于 flyway-core。
    runtimeOnly 'com.h2database:h2:2.3.232'

    // HikariCP 连接池（Spring Boot 默认使用，但显式添加以确保版本控制）
    implementation 'com.zaxxer:HikariCP'

    // JSON 处理
    // Versions are managed by the Spring Boot BOM; do not pin an older Jackson line here.
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.core:jackson-core'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // YAML 处理
    implementation 'org.yaml:snakeyaml'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

    // MyBatis（用于内置 Mapper 解析器）
    implementation 'org.mybatis:mybatis:3.5.19'

    // Apache POI：Excel 业务知识模板的确定性解析（development-guide §7.1）
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    // 标准报告 JSON Schema 校验（docs/contracts/report-schema.json）
    implementation 'com.networknt:json-schema-validator:1.5.6'

    // AgentScope Java 2.x - HarnessAgent 是服务端长运行 Agent 的正式入口。
    implementation 'io.agentscope:agentscope-harness:2.0.0'
    implementation 'io.agentscope:agentscope-extensions-model-openai:2.0.0'
    implementation 'io.agentscope:agentscope-extensions-postgresql:2.0.0'
    // AG-UI 适配器：RunAgentInput -> Flux<AguiEvent>，IDEA 通过 HTTPS SSE 消费（docs/contracts/ag-ui-mapping.md）。
    implementation 'io.agentscope:agentscope-extensions-agui:2.0.0'
    // RAG：SimpleKnowledge + PgVectorStore，业务知识检索层（development-guide §2.4）。
    implementation 'io.agentscope:agentscope-extensions-rag-simple:2.0.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    // Lombok for tests
    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

    // 开发工具
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // 测试
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.testcontainers:mysql:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // H2：Repository Contract Test 的无 Docker 门禁（每次本地构建强制运行）。
    testImplementation 'com.h2database:h2:2.3.232'
    // 架构守卫（docs/cloud-code-next-goal.md §3.7）。
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

tasks.named('test') {
    useJUnitPlatform()
}
